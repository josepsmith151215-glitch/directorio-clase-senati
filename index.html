<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Directorio Colaborativo - Clase en Vivo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="main-header">
      <h1>👨‍💻 Directorio de la Clase</h1>
      <p>
        Construido colaborativamente en tiempo real usando Git, GitHub y Pull
        Requests.
      </p>
    </header>

    <!-- CONTENEDOR PRINCIPAL DE TARJETAS -->
    <main class="grid-container" id="tarjetas">
      <!-- TARJETA DEL INSTRUCTOR (Ejemplo base) -->
      <div class="card instructor-card">
        <div class="card-header">
          <h3>Rafael Quevedo</h3>
          <span class="badge">Instructor</span>
        </div>
        <div class="card-body">
          <p><strong>Especialidad:</strong> Software, IoT & Cloud</p>
          <p><em>"Bienvenidos al taller de flujos corporativos reales."</em></p>
        </div>
      </div>

      <!-- ⚠️ LAS TARJETAS DE LOS ALUMNOS SE INSERTARÁN AQUÍ AUTOMÁTICAMENTE -->
    </main>

    <footer class="main-footer">
      <p>&copy; 2026 - SENATI. Todos los derechos reservados.</p>
    </footer>
  </body>
